spring:
  application:
    name: landing-connector
  main:
    banner-mode: off
  # HTTP push (design §5.3.15): uploads would be parsed into temporary
  # files, unencrypted, before the route saw them; the endpoint takes the
  # body as it is.
  servlet:
    multipart:
      enabled: false

camel:
  main:
    name: landing-connector
    # PHI hygiene (design §7.5): no body logging, tracing or message history.
    tracing: false
    backlog-tracing: false
    message-history: false
    log-mask: true
    log-exhausted-message-body: false
    # Keeps the JVM alive: only an http intake has a web server, and no
    # other thread is non-daemon.
    run-controller: true

# Telemetry (design §12): exported through sdh.telemetry.otlp with the PHI
# allow-list filter, so Boot's own OTLP exporters are off.
management:
  tracing:
    sampling:
      probability: 1.0
    export:
      otlp:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false
  otlp:
    metrics:
      export:
        enabled: false

# Azure's JDK HTTP client warns on every request about a header it sets
# itself (design §8.1).
logging:
  level:
    com.azure.core.http.jdk.httpclient.JdkHttpClient: error
    # smbj logs share paths and file names (design §5.3.4); the node reports
    # SMB failures itself, without them. JSch's logging is off in code.
    com.hierynomus: off

sdh:
  connector-id: landing-connector
