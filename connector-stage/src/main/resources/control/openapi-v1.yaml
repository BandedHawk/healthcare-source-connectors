openapi: 3.1.0
info:
  title: Pipeline stage control API
  version: "1"
  description: |
    A stage's control API (CONTROL-API-DESIGN.md). Each stage serves its
    own, from its control Deployment; an operation a stage doesn't have is
    answered 404 `not-on-this-stage`.

    Every call is authenticated (an OIDC bearer token, or a client
    certificate, as the stage's settings choose), checked against the
    permission its operation needs, and audited as
    `sdh.audit.control.<operation>` with the caller's principal and the
    request's ID, which every answer carries in `X-Request-Id`. Answers
    hold no PHI: a failure is named by its class alone.

    Actions (`POST`, `DELETE`) need an `Idempotency-Key` header and a JSON
    body with a `reason`, which is audited. A retry with the same key, path
    and body, from the same principal, within 24 hours, gets the first
    answer back and does nothing again; the same key with another request
    is `409 idempotency-key-reused`. A long operation the stage's workers
    carry out is answered `202`, with `Location` giving its record under
    `/operations`, which follows it to the end.

    A PHI result (`export`, the patient lookup, `restore`) is sealed to
    one of the caller's own sealing keys, registered in advance by someone
    else with `keys.admin` (`/operator-keys`), and named by its
    fingerprint in `sealTo`. Its answer is `application/x-ndjson`: a
    header line, a line per sealed part (a compact JWE,
    `ECDH-ES+A256KW` or `RSA-OAEP-256` with `A256GCM`), and a trailer with
    the count of parts and the SHA-256 of their JWEs, in order, as ASCII,
    with nothing between them. A stream without its trailer was cut off:
    discard it. A sealed request needs a `reason`, and no
    `Idempotency-Key`: asking again reads again, audited again.

    An action that needs a second person (audit prune, a plaintext
    break-glass restore) isn't carried out when asked: it is answered
    `202` with its record in state `awaiting-approval`. Another principal
    holding the same permissions approves or rejects it
    (`/operations/{id}/approve`, `/reject`), never its requester; the
    requester may cancel it (`/cancel`) before it runs. One not decided
    within `sdh.control.approval.ttl` (24 h; 1 h for break-glass)
    expires. Once approved, a control pod runs it, audited with both
    principals. A decision needs a `reason` and no `Idempotency-Key`: it
    can be made once, and asking again is `409 wrong-state`.

    A break-glass result is held encrypted under the stage's KEK, never
    in the clear at rest, for its requester to fetch once, within the
    break-glass TTL, from `/operations/{id}/result`; it is then deleted.

    A pause (`/pause`) stops the stage's pods taking new work within
    seconds, whatever pods start or stop, until `/resume`; work already
    taken finishes, and nothing is dropped. `/drain` pauses, then is
    followed as an operation until no pod holds a live claim.

    This version serves the queries (build step C2), the actions (C3),
    the sealed results and sealing keys (C4), four eyes and break-glass
    (C5), and pause, resume and drain (C6).
servers:
  - url: https://{host}:8443/api/v1
    variables:
      host:
        default: sdh-control
security:
  - bearer: []
  - clientCertificate: []
paths:
  /status:
    get:
      operationId: status
      summary: The stage's status
      description: >-
        Its duties' leases, its items, claims and reconciler. Each part is
        read on its own; a part that can't be read is answered as
        `{"unavailable": "<class>"}`. Permission `pipeline.view`.
      responses:
        "200": {$ref: "#/components/responses/Answer"}
        default: {$ref: "#/components/responses/Problem"}
  /items/{itemId}/status:
    get:
      operationId: itemStatus
      summary: One item's status
      description: Permission `pipeline.view`.
      parameters:
        - {$ref: "#/components/parameters/itemIdPath"}
      responses:
        "200": {$ref: "#/components/responses/Answer"}
        default: {$ref: "#/components/responses/Problem"}
  /stuck:
    get:
      operationId: stuck
      summary: Items idle for longer than a time, and their claims
      description: Permission `pipeline.view`.
      parameters:
        - name: idle
          in: query
          description: How long idle, such as `30m` (the CLI's default if
            not given).
          schema: {type: string}
      responses:
        "200": {$ref: "#/components/responses/Answer"}
        default: {$ref: "#/components/responses/Problem"}
  /drain:
    get:
      operationId: drainCheck
      summary: Whether this release may be let in, and what blocks it
      description: Permission `pipeline.view`.
      responses:
        "200": {$ref: "#/components/responses/Answer"}
        default: {$ref: "#/components/responses/Problem"}
    post:
      operationId: drain
      summary: Pauses the stage, then follows it until nothing is claimed
      description: >-
        Pauses as `/pause` does, with the reason kept with the pause, and
        is answered `202` with its record. The record is done once the
        stage has been paused for 15 seconds, so every pod has read the
        pause, and no pod holds a live claim on a record or item; failed
        if the stage is resumed first. The stage stays paused. Not on the
        landing node. Permission `pipeline.operate`.
      parameters:
        - {$ref: "#/components/parameters/idempotencyKey"}
      requestBody: {$ref: "#/components/requestBodies/Reasoned"}
      responses:
        "202": {$ref: "#/components/responses/Accepted"}
        default: {$ref: "#/components/responses/Problem"}
  /control-state:
    get:
      operationId: controlState
      summary: Whether the stage is paused, by whom, since when, and why
      description: Permission `pipeline.view`.
      responses:
        "200": {$ref: "#/components/responses/Paused"}
        default: {$ref: "#/components/responses/Problem"}
  /pause:
    post:
      operationId: pause
      summary: Stops the stage's pods taking new work
      description: >-
        Within seconds, the stage's input is suspended, a reprocess run's
        objects aren't queued and corrections aren't applied; the landing
        node lists nothing and answers pushes `503`. Work already taken
        finishes and commits, and leases are still renewed. Kept, with who
        paused, when and the reason, until `/resume`. A stage already
        paused keeps its first pause (`changed` false). Permission
        `pipeline.operate`.
      parameters:
        - {$ref: "#/components/parameters/idempotencyKey"}
      requestBody: {$ref: "#/components/requestBodies/Reasoned"}
      responses:
        "200": {$ref: "#/components/responses/Paused"}
        default: {$ref: "#/components/responses/Problem"}
  /resume:
    post:
      operationId: resume
      summary: Clears the stage's pause; its pods take work again
      description: >-
        Within seconds. A stage not paused is left as it is (`changed`
        false). Permission `pipeline.operate`.
      parameters:
        - {$ref: "#/components/parameters/idempotencyKey"}
      requestBody: {$ref: "#/components/requestBodies/Reasoned"}
      responses:
        "200": {$ref: "#/components/responses/Paused"}
        default: {$ref: "#/components/responses/Problem"}
  /version:
    get:
      operationId: version
      summary: This release and the releases let in before it
      description: Permission `pipeline.view`.
      responses:
        "200": {$ref: "#/components/responses/Answer"}
        default: {$ref: "#/components/responses/Problem"}
  /failures:
    get:
      operationId: failures
      summary: The fail store's open failures, or one item's
      description: >-
        Counts, codes, states and events only: never a record's content or
        a failure's sealed reason. Permission `pipeline.view`.
      parameters:
        - name: itemId
          in: query
          schema: {type: string, format: uuid}
        - name: all
          in: query
          description: Every failure, not only open ones.
          schema: {type: boolean, default: false}
      responses:
        "200": {$ref: "#/components/responses/Answer"}
        default: {$ref: "#/components/responses/Problem"}
  /reprocess-runs:
    post:
      operationId: reprocess
      summary: Starts a reprocess run, or shows what it would choose
      description: >-
        Chooses by `itemIds` (with `seq` for one record), by `madeBy`, or by
        `landedFrom` and `landedTo` (the split stage, with `intake`). The
        reason is kept encrypted with the run, as the CLI keeps it. A run
        recorded is answered `202` and followed as an operation; a dry run,
        or nothing chosen, `200`. Permission `pipeline.operate`.
      parameters:
        - {$ref: "#/components/parameters/idempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: "#/components/schemas/Reasoned"}
                - type: object
                  properties:
                    itemIds: {type: array, items: {type: string, format: uuid}}
                    seq: {type: integer}
                    madeBy: {type: string}
                    landedFrom: {type: string, format: date-time}
                    landedTo: {type: string, format: date-time}
                    intake: {type: string}
                    dryRun: {type: boolean}
      responses:
        "200": {$ref: "#/components/responses/Answer"}
        "202": {$ref: "#/components/responses/Accepted"}
        default: {$ref: "#/components/responses/Problem"}
  /reprocess-runs/{runId}:
    delete:
      operationId: reprocessCancel
      summary: Cancels what of a run isn't yet queued
      description: Permission `pipeline.operate`.
      parameters:
        - {$ref: "#/components/parameters/idempotencyKey"}
        - name: runId
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody: {$ref: "#/components/requestBodies/Reasoned"}
      responses:
        "200": {$ref: "#/components/responses/Answer"}
        default: {$ref: "#/components/responses/Problem"}
    get:
      operationId: reprocessStatus
      summary: A reprocess run's status
      description: Permission `pipeline.view`.
      parameters:
        - name: runId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200": {$ref: "#/components/responses/Answer"}
        default: {$ref: "#/components/responses/Problem"}
  /audit/verify:
    get:
      operationId: auditVerify
      summary: Checks the audit journal's chains and seals
      description: Permission `audit.read`.
      parameters:
        - {$ref: "#/components/parameters/from"}
        - {$ref: "#/components/parameters/to"}
        - name: stale
          in: query
          description: How long a chain may stay open before it is
            reported, such as `2h`.
          schema: {type: string}
      responses:
        "200": {$ref: "#/components/responses/Answer"}
        default: {$ref: "#/components/responses/Problem"}
  /audit/events:
    get:
      operationId: auditExport
      summary: The audit journal's events, as JSON lines
      description: >-
        One event a line, then a last line `{"end": true, "rows": n}`. A
        read that fails part way ends with
        `{"end": false, "incomplete": true, "rows": n, "reason": "<class>"}`
        instead, since the status is already sent. Permission `audit.read`.
      parameters:
        - {$ref: "#/components/parameters/from"}
        - {$ref: "#/components/parameters/to"}
      responses:
        "200":
          description: The events.
          headers:
            X-Request-Id: {$ref: "#/components/headers/RequestId"}
          content:
            application/x-ndjson:
              schema: {type: object}
        default: {$ref: "#/components/responses/Problem"}
  /failures/{itemId}/{seq}/retry:
    post:
      operationId: failureRetry
      summary: Has the stage process a failure again, as it was
      description: Permission `pipeline.operate`.
      parameters:
        - {$ref: "#/components/parameters/idempotencyKey"}
        - {$ref: "#/components/parameters/itemIdPath"}
        - {$ref: "#/components/parameters/seqPath"}
      requestBody: {$ref: "#/components/requestBodies/Reasoned"}
      responses:
        "200": {$ref: "#/components/responses/Answer"}
        default: {$ref: "#/components/responses/Problem"}
  /failures/{itemId}/{seq}/decline:
    post:
      operationId: failureDecline
      summary: "Declines a failure: nothing more is done with it"
      description: >-
        The reason is kept encrypted. Permission `pipeline.operate`.
      parameters:
        - {$ref: "#/components/parameters/idempotencyKey"}
        - {$ref: "#/components/parameters/itemIdPath"}
        - {$ref: "#/components/parameters/seqPath"}
      requestBody: {$ref: "#/components/requestBodies/Reasoned"}
      responses:
        "200": {$ref: "#/components/responses/Answer"}
        default: {$ref: "#/components/responses/Problem"}
  /failures/{itemId}/{seq}/reopen:
    post:
      operationId: failureReopen
      summary: Reopens a declined failure
      description: >-
        The reason is kept encrypted. Permission `pipeline.operate`.
      parameters:
        - {$ref: "#/components/parameters/idempotencyKey"}
        - {$ref: "#/components/parameters/itemIdPath"}
        - {$ref: "#/components/parameters/seqPath"}
      requestBody: {$ref: "#/components/requestBodies/Reasoned"}
      responses:
        "200": {$ref: "#/components/responses/Answer"}
        default: {$ref: "#/components/responses/Problem"}
  /failures/{itemId}/{seq}/correct:
    post:
      operationId: failureCorrect
      summary: Submits a corrected record for a failure
      description: >-
        The record, base64 in `record`, is stored encrypted and processed
        by the stage's workers as any input; it is never answered or
        audited. Permissions `pipeline.operate` and `phi.export`.
      parameters:
        - {$ref: "#/components/parameters/idempotencyKey"}
        - {$ref: "#/components/parameters/itemIdPath"}
        - {$ref: "#/components/parameters/seqPath"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: "#/components/schemas/Reasoned"}
                - type: object
                  required: [record]
                  properties:
                    record: {type: string, contentEncoding: base64}
      responses:
        "200": {$ref: "#/components/responses/Answer"}
        default: {$ref: "#/components/responses/Problem"}
  /version/accept:
    post:
      operationId: versionAccept
      summary: Accepts the running version early
      description: >-
        The reason is kept encrypted. Permission `pipeline.operate`.
      parameters:
        - {$ref: "#/components/parameters/idempotencyKey"}
      requestBody: {$ref: "#/components/requestBodies/Reasoned"}
      responses:
        "200": {$ref: "#/components/responses/Answer"}
        default: {$ref: "#/components/responses/Problem"}
  /items/{itemId}/release:
    post:
      operationId: release
      summary: Ends the hold on an item held across versions (split stage)
      description: >-
        `resume` splits it on from its checkpoint; `close` ends it, the
        reason kept encrypted. Permission `pipeline.operate`.
      parameters:
        - {$ref: "#/components/parameters/idempotencyKey"}
        - {$ref: "#/components/parameters/itemIdPath"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: "#/components/schemas/Reasoned"}
                - type: object
                  properties:
                    resume: {type: boolean}
                    close: {type: boolean}
      responses:
        "200": {$ref: "#/components/responses/Answer"}
        default: {$ref: "#/components/responses/Problem"}
  /items/{itemId}/resubmit:
    post:
      operationId: resubmit
      summary: Lands an item again, as a new item linked to it (landing)
      description: >-
        Answered `202` and followed as an operation, done once the landing
        node has landed it again, failed if it refused. `again` lands
        another copy of an item landed again before. Permission
        `pipeline.operate`.
      parameters:
        - {$ref: "#/components/parameters/idempotencyKey"}
        - {$ref: "#/components/parameters/itemIdPath"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: "#/components/schemas/Reasoned"}
                - type: object
                  properties:
                    again: {type: boolean}
      responses:
        "202": {$ref: "#/components/responses/Accepted"}
        default: {$ref: "#/components/responses/Problem"}
  /audit/prune:
    post:
      operationId: auditPrune
      summary: Deletes the audit journal's chains last written before a time
      description: >-
        Needs four eyes: answered `202` with its record awaiting approval,
        and run once another audit admin approves it. Export the chains
        first if they must be kept elsewhere. Permission `audit.admin`.
      parameters:
        - {$ref: "#/components/parameters/idempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: "#/components/schemas/Reasoned"}
                - type: object
                  required: [before]
                  properties:
                    before:
                      type: string
                      description: >-
                        A date or instant at least 10 minutes before the
                        run.
      responses:
        "202": {$ref: "#/components/responses/Accepted"}
        default: {$ref: "#/components/responses/Problem"}
  /items/{itemId}/restore/plaintext:
    post:
      operationId: restorePlaintext
      summary: Restores a landed item in plaintext, break-glass (split stage)
      description: >-
        Needs four eyes and a ticket: answered `202` with its record
        awaiting approval, and run once another principal with
        `phi.break-glass` approves it. Its result is then held encrypted
        for the requester to fetch once from `/operations/{id}/result`.
        Permission `phi.break-glass`.
      parameters:
        - {$ref: "#/components/parameters/idempotencyKey"}
        - {$ref: "#/components/parameters/itemIdPath"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: "#/components/schemas/Reasoned"}
                - type: object
                  required: [ticket]
                  properties:
                    ticket:
                      type: string
                      description: The change or incident it is for.
                      pattern: "^[A-Za-z0-9._:/-]{1,64}$"
                    fromOffset: {type: integer, minimum: 0}
                    unprocessed: {type: boolean}
      responses:
        "202": {$ref: "#/components/responses/Accepted"}
        default: {$ref: "#/components/responses/Problem"}
  /operations/{id}/approve:
    post:
      operationId: operationApprove
      summary: Approves an operation awaiting a second person
      description: >-
        The caller holds every permission the operation needs, and isn't
        its requester (`403 own-request`). It then runs. Audited as
        `sdh.audit.control.operation_approve`.
      parameters:
        - {$ref: "#/components/parameters/operationId"}
      requestBody: {$ref: "#/components/requestBodies/Reasoned"}
      responses:
        "200": {$ref: "#/components/responses/Decided"}
        default: {$ref: "#/components/responses/Problem"}
  /operations/{id}/reject:
    post:
      operationId: operationReject
      summary: Rejects an operation awaiting a second person
      description: >-
        As for approving: the caller holds its permissions and isn't its
        requester. It never runs.
      parameters:
        - {$ref: "#/components/parameters/operationId"}
      requestBody: {$ref: "#/components/requestBodies/Reasoned"}
      responses:
        "200": {$ref: "#/components/responses/Decided"}
        default: {$ref: "#/components/responses/Problem"}
  /operations/{id}/cancel:
    post:
      operationId: operationCancel
      summary: Cancels one's own request before it runs
      description: >-
        Only its requester (`403 not-your-request`), while it awaits
        approval or is approved and not yet taken by a control pod.
      parameters:
        - {$ref: "#/components/parameters/operationId"}
      requestBody: {$ref: "#/components/requestBodies/Reasoned"}
      responses:
        "200": {$ref: "#/components/responses/Decided"}
        default: {$ref: "#/components/responses/Problem"}
  /operations/{id}/result:
    get:
      operationId: operationResult
      summary: A break-glass result, in plaintext, once
      description: >-
        Only its requester, with `phi.break-glass`, once the operation is
        done and within the break-glass TTL. It is deleted once fetched,
        whether or not the fetch completes: ask for the restore again if
        it didn't. Otherwise `410 result-gone`.
      parameters:
        - {$ref: "#/components/parameters/operationId"}
      responses:
        "200":
          description: The result.
          headers:
            X-Request-Id: {$ref: "#/components/headers/RequestId"}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        default: {$ref: "#/components/responses/Problem"}
  /operations:
    get:
      operationId: operations
      summary: The stage's long operations, newest first
      description: >-
        Each not finished is brought up to date from the stage as it is
        read. Permission `pipeline.view`.
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 1000, default: 100}
        - name: cursor
          in: query
          description: The `next` of the page before.
          schema: {type: string}
      responses:
        "200":
          description: A page of operations.
          content:
            application/json:
              schema:
                type: object
                properties:
                  operations:
                    type: array
                    items: {$ref: "#/components/schemas/Operation"}
                  next: {type: [string, "null"]}
        default: {$ref: "#/components/responses/Problem"}
  /operations/{id}:
    get:
      operationId: operation
      summary: One long operation
      description: Permission `pipeline.view`.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: The operation.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Operation"}
        default: {$ref: "#/components/responses/Problem"}
  /failures/{itemId}/{seq}/export:
    post:
      operationId: failureExport
      summary: What a failure failed on, sealed to the caller
      description: Permission `phi.export`. One sealed part.
      parameters:
        - {$ref: "#/components/parameters/itemIdPath"}
        - {$ref: "#/components/parameters/seqPath"}
      requestBody: {$ref: "#/components/requestBodies/Sealed"}
      responses:
        "200": {$ref: "#/components/responses/SealedParts"}
        default: {$ref: "#/components/responses/Problem"}
  /patients/lookup:
    post:
      operationId: patientsLookup
      summary: The patients the stage's FHIR records name, sealed
      description: >-
        Records-holding stages. Give `itemIds`, or `from` and `to` (at most
        31 days apart). With `identifiers`, lists only the records naming
        one of them (a patient's records); without, lists every record with
        its patients' identifiers (who an incident touched). Each part is a
        page of JSON lines: item, seq, record, patients. The identifiers
        are never audited or answered. Permission `phi.export`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: "#/components/schemas/Sealed"}
                - type: object
                  properties:
                    itemIds:
                      type: array
                      items: {type: string, format: uuid}
                    from: {type: string, description: A date or instant.}
                    to: {type: string, description: A date or instant.}
                    identifiers:
                      type: array
                      maxItems: 1000
                      items:
                        type: string
                        maxLength: 512
                        description: "system|value, or a value for any system"
      responses:
        "200": {$ref: "#/components/responses/SealedParts"}
        default: {$ref: "#/components/responses/Problem"}
  /items/{itemId}/restore:
    post:
      operationId: itemRestore
      summary: A landed item, decrypted, digest checked, sealed to the caller
      description: >-
        The split stage. Each part holds up to 1 MiB of the item, in
        order, numbered in its protected header (`sdh_item`, `sdh_part`,
        `sdh_offset`, `sdh_last`). The digest is checked over the whole
        item; on a mismatch the stream ends without its trailer. Permission
        `phi.export`.
      parameters:
        - {$ref: "#/components/parameters/itemIdPath"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: "#/components/schemas/Sealed"}
                - type: object
                  properties:
                    fromOffset: {type: integer, minimum: 0}
                    unprocessed:
                      type: boolean
                      description: Start after the item's last split record.
      responses:
        "200": {$ref: "#/components/responses/SealedParts"}
        default: {$ref: "#/components/responses/Problem"}
  /operator-keys:
    get:
      operationId: operatorKeys
      summary: The principals' sealing keys, without the keys
      description: Permission `keys.admin`.
      parameters:
        - name: principal
          in: query
          schema: {type: string}
      responses:
        "200":
          description: The keys, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items: {$ref: "#/components/schemas/OperatorKey"}
        default: {$ref: "#/components/responses/Problem"}
    post:
      operationId: operatorKeyRegister
      summary: Registers a sealing key for a principal
      description: >-
        EC P-256 or P-384, or RSA of at least 3072 bits, expiring within a
        year. Permission `keys.admin`, and never for the caller itself
        (`403 not-for-yourself`), so registering a key and sealing to it are
        two people. A key registered already is `409 refused`.
      parameters:
        - {$ref: "#/components/parameters/idempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: "#/components/schemas/Reasoned"}
                - type: object
                  required: [principal, publicKey, expiresAt]
                  properties:
                    principal: {type: string, maxLength: 256}
                    publicKey:
                      type: string
                      description: PEM, BEGIN PUBLIC KEY.
                    expiresAt: {type: string, format: date-time}
      responses:
        "200":
          description: The key, as registered.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OperatorKey"}
        default: {$ref: "#/components/responses/Problem"}
  /operator-keys/{fingerprint}:
    delete:
      operationId: operatorKeyRevoke
      summary: Revokes a sealing key
      description: >-
        It stays listed, revoked. Permission `keys.admin`; a principal may
        revoke its own.
      parameters:
        - {$ref: "#/components/parameters/idempotencyKey"}
        - name: fingerprint
          in: path
          required: true
          schema: {type: string, pattern: "^[0-9a-f]{64}$"}
      requestBody: {$ref: "#/components/requestBodies/Reasoned"}
      responses:
        "200":
          description: The key, revoked.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OperatorKey"}
        default: {$ref: "#/components/responses/Problem"}
  /openapi.yaml:
    get:
      operationId: openapi
      summary: This description
      description: Any authenticated caller.
      responses:
        "200":
          description: This file.
          content:
            application/yaml: {}
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        From the customer's identity provider: signed (RS*, PS* or ES*),
        from `sdh.control.auth.jwt.issuer-uri`, for
        `sdh.control.auth.jwt.audience`, with issue and expiry times no
        more than `max-lifetime` apart (one hour at most under the hipaa
        profile), naming the caller in the principal claim. Its roles claim
        is mapped to permissions by `sdh.control.permissions`.
    clientCertificate:
      type: mutualTLS
      description: >-
        From a CA in `sdh.control.auth.mtls.trusted-ca`, with a subject
        listed in `sdh.control.auth.mtls.roles`.
  parameters:
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Of the client's choosing, unique per request.
      schema: {type: string, pattern: "^[A-Za-z0-9._:-]{8,128}$"}
    operationId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    seqPath:
      name: seq
      in: path
      required: true
      description: The failure's record number; -1 for the item as a whole.
      schema: {type: integer}
    itemIdPath:
      name: itemId
      in: path
      required: true
      schema: {type: string, format: uuid}
    from:
      name: from
      in: query
      description: A date or instant.
      schema: {type: string}
    to:
      name: to
      in: query
      description: A date or instant.
      schema: {type: string}
  headers:
    RequestId:
      description: The request's ID, as its audit event names it.
      schema: {type: string, format: uuid}
  requestBodies:
    Reasoned:
      required: true
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Reasoned"}
    Sealed:
      required: true
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Sealed"}
  responses:
    SealedParts:
      description: The result, sealed, as JSON lines.
      headers:
        X-Request-Id: {$ref: "#/components/headers/RequestId"}
      content:
        application/x-ndjson:
          schema:
            oneOf:
              - title: Header
                type: object
                properties:
                  operation: {type: string}
                  sealedTo: {type: string}
                  requestId: {type: string, format: uuid}
              - title: Part
                type: object
                properties:
                  part: {type: integer, minimum: 1}
                  jwe: {type: string}
              - title: Trailer
                type: object
                properties:
                  end: {const: true}
                  parts: {type: integer}
                  sha256: {type: string}
                  requestId: {type: string, format: uuid}
              - title: Incomplete
                type: object
                description: The stream broke part way; discard it.
                properties:
                  end: {const: false}
                  incomplete: {const: true}
                  parts: {type: integer}
                  reason: {type: string}
    Accepted:
      description: A long operation started; poll its record.
      headers:
        X-Request-Id: {$ref: "#/components/headers/RequestId"}
        Location:
          description: The operation's record.
          schema: {type: string}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Operation"}
    Decided:
      description: The operation's record, as decided.
      headers:
        X-Request-Id: {$ref: "#/components/headers/RequestId"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Operation"}
    Paused:
      description: The stage's pause, as it stands after the call.
      headers:
        X-Request-Id: {$ref: "#/components/headers/RequestId"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Paused"}
    Answer:
      description: The operation's answer.
      headers:
        X-Request-Id: {$ref: "#/components/headers/RequestId"}
      content:
        application/json:
          schema: {type: object}
    Problem:
      description: >-
        A refusal (RFC 9457). `title` is one of `bad-request` (400),
        `unauthenticated` (401), `permission-required`, `approval-required`,
        `sealing-key-not-yours`, `not-for-yourself`, `own-request`,
        `not-your-request` or `forbidden` (403), `not-on-this-stage`,
        `operation-not-found` or `key-not-found` (404), `refused` (409, the
        stage refused it as things stand), `idempotency-key-reused`,
        `in-progress` or `wrong-state` (409), `result-gone` (410),
        `too-large` (413) or `failed` (500). A refusal of an action is kept as its key's
        answer too: retry it with a new key.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
  schemas:
    Reasoned:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          description: >-
            Why; audited. Letters, digits, spaces and . , : _ # / -
          pattern: "^[A-Za-z0-9 .,:_#/-]{1,200}$"
    Sealed:
      allOf:
        - {$ref: "#/components/schemas/Reasoned"}
        - type: object
          required: [sealTo]
          properties:
            sealTo:
              type: string
              pattern: "^[0-9a-f]{64}$"
              description: >-
                The fingerprint (SHA-256 of the SubjectPublicKeyInfo) of one
                of the caller's own registered keys, unexpired and not
                revoked; otherwise `403 sealing-key-not-yours`.
    OperatorKey:
      type: object
      properties:
        fingerprint: {type: string}
        principal: {type: string}
        registeredBy: {type: string}
        registeredAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        revokedBy: {type: [string, "null"]}
        revokedAt: {type: [string, "null"], format: date-time}
    Paused:
      type: object
      required: [scope, paused]
      properties:
        scope:
          type: string
          description: >-
            The stage's deployment, as its audit chains name it, such as
            `convert/<connector ID>`; a landing node's is its intake's.
        paused: {type: boolean}
        pausedBy: {type: [string, "null"]}
        pausedAt: {type: [string, "null"], format: date-time}
        reason: {type: [string, "null"]}
        changed:
          type: boolean
          description: Whether this call paused or resumed it.
    Operation:
      type: object
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, examples: [reprocess, resubmit, audit-prune]}
        scope: {type: string, examples: ["stage:file-connector"]}
        state:
          type: string
          enum: [awaiting-approval, approved, running, done, failed,
                 cancelled, rejected, expired]
        requestedBy: {type: string}
        reason: {type: string}
        requestedAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        parameters:
          type: object
          description: >-
            What it acts on: identifiers, times and counts, never PHI. For
            one awaiting approval, the route it was asked by, its path's
            variables, its body's fields, the permissions an approver
            needs, and `approveBy`, when it expires unapproved.
        progress: {type: object}
        ticket: {type: string}
        decidedBy:
          type: string
          description: Who approved or rejected it.
        decision:
          type: string
          description: Why they did.
        decidedAt: {type: string, format: date-time}
        result:
          type: object
          description: >-
            What it did, once finished: counts; for a failure, its class.
            A break-glass result gives `resultParts`, `resultBytes`,
            `resultUntil` and `resultAt`, where it is fetched.
        progressUnavailable:
          type: string
          description: Why the stage couldn't be read for it; the class only.
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: {type: string, examples: ["urn:sdh:control:permission-required"]}
        title: {type: string}
        status: {type: integer}
        detail:
          type: string
          description: What to do about it; for a failure, its class only.
        requestId: {type: string, format: uuid}
