# Vulnerabilities accepted for release (design §14.5), read by scripts/vuln-scan.sh as grype configuration.
#
# The scan fails a release on any High or Critical vulnerability with a fix available. Accept one here only when it
# doesn't affect us (the vulnerable code isn't reachable, or the setting it needs isn't used), and say why. Name the
# package, so the entry can't hide the same vulnerability in something else, and review the list at each release.
#
#   - vulnerability: CVE-2026-12345
#     package:
#       name: example-lib
#     reason: "Only the XML parser is affected; we never parse XML with it. Reviewed 2026-10-29 by <name>."
ignore:
  # parquet-jackson 1.17.1 (shaded Jackson 2.21.3)
  - vulnerability: GHSA-rmj7-2vxq-3g9f
    package:
      name: jackson-databind
      version: 2.21.3
    reason: "Jackson 2.21.3 bundled (shaded) inside parquet-jackson 1.17.1, which Iceberg 1.12.0 is built against; Parquet's newest release still bundles an affected 2.22.2. Only Parquet's JSON rendering of file metadata (ParquetMetadata) and its own encryption key tools (crypto/keytools) use this copy. We use neither: our encryption is our own, and no external JSON is parsed with it, so the parsing and polymorphic-typing paths these advisories need are not reachable. The application's own Jackson is 2.22.3. Reviewed 2026-10-29; drop when Parquet bundles a fixed Jackson."
