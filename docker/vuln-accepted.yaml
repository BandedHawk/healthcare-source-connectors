  # hadoop-shaded-guava 1.5.0 (shaded Guava 33.4.8)
  - vulnerability: GHSA-xxph-c9ww-hj94
    package:
      name: guava
      version: 33.4.8-jre
    reason: "Guava 33.4.8 bundled (shaded) inside hadoop-shaded-guava 1.5.0, the newest release, which Hadoop's Configuration classes need. The advisory needs Java deserialization (ObjectInputStream) of untrusted data; the connector never Java-deserializes anything. The application's own Guava is 33.7.2. Reviewed 2026-10-29; drop when a fixed hadoop-shaded-guava is released."
