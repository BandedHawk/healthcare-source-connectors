# Components the packaging adds to an application's jar without their being Maven dependencies, so the license
# plugin doesn't see them (design §14.2). groupId:artifactId = name | project URL | license (a canonical name).
# Each application's pom copies the jar to target/packaging-extras; the attribution step gives it an entry in
# THIRD-PARTY.txt like any other component. ThirdPartyAttributionIT fails on any bundled jar without an entry.
org.springframework.boot\:spring-boot-jarmode-tools = Spring Boot Jarmode Tools | https://spring.io/projects/spring-boot | Apache-2.0
