# Native code a component's jar carries, built from another project whose license texts the jar doesn't ship
# (design §14.2): its own LICENSE, from src/license/bundled-native/, is added to the component's entry in
# THIRD-PARTY.txt. Key: groupId:artifactId:version, so an upgrade of the component fails the build until the
# bundled version and its text are checked again. Value: name | version | project | file in bundled-native/.
#
# Amazon Corretto Crypto Provider: its native library is built with AWS-LC (strings in the library: "AWS-LC
# 1.47.0"). Conscrypt: its native libraries are built with BoringSSL (its jar's manifest: BoringSSL-Version).
software.amazon.cryptools\:AmazonCorrettoCryptoProvider\:2.5.0=AWS-LC | 1.47.0 | https://github.com/aws/aws-lc | aws-lc-1.47.0-LICENSE.txt
org.conscrypt\:conscrypt-openjdk-uber\:2.9.0=BoringSSL | 427ec40cc8edc545253289232e885708c409e5ea | https://boringssl.googlesource.com/boringssl | boringssl-427ec40c-LICENSE.txt
