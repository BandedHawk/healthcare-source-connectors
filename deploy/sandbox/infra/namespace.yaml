# The services every pipeline uses, as a customer would run them (scripts/sandbox.sh, docs/SANDBOX.md): the
# catalog and lease database, the broker, object storage, the key service and telemetry. Their images don't all
# meet the restricted Pod Security Standard, so this namespace enforces baseline and warns on restricted; the
# pipelines' namespaces enforce restricted.
apiVersion: v1
kind: Namespace
metadata:
  name: sdh-infra
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
---
# Nothing reaches the services but each other, and the namespaces labelled sdh.smiledigitalhealth.com/infra-client
# on each service's own port (below). Grafana is reached by port-forward only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: each-other-only, namespace: sdh-infra }
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: {} }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: clients-to-postgres, namespace: sdh-infra }
spec:
  podSelector: { matchLabels: { app: postgres } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ namespaceSelector: { matchLabels: { sdh.smiledigitalhealth.com/infra-client: "true" } } }]
      ports: [{ port: 5432 }]   # catalog and leases
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: clients-to-kafka, namespace: sdh-infra }
spec:
  podSelector: { matchLabels: { app: kafka } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ namespaceSelector: { matchLabels: { sdh.smiledigitalhealth.com/infra-client: "true" } } }]
      ports: [{ port: 9092 }]   # broker
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: clients-to-seaweedfs, namespace: sdh-infra }
spec:
  podSelector: { matchLabels: { app: seaweedfs } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ namespaceSelector: { matchLabels: { sdh.smiledigitalhealth.com/infra-client: "true" } } }]
      ports: [{ port: 8333 }]   # S3
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: clients-to-vault, namespace: sdh-infra }
spec:
  podSelector: { matchLabels: { app: vault } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ namespaceSelector: { matchLabels: { sdh.smiledigitalhealth.com/infra-client: "true" } } }]
      ports: [{ port: 8200 }]   # Transit
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: clients-to-otel-collector, namespace: sdh-infra }
spec:
  podSelector: { matchLabels: { app: otel-collector } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ namespaceSelector: { matchLabels: { sdh.smiledigitalhealth.com/infra-client: "true" } } }]
      ports: [{ port: 4318 }]   # OTLP/HTTP
