# The key service: HashiCorp Vault's Transit engine holds every KEK and signing key, which never leave it
# (design §7.4, provider vault-transit). Integrated (raft) storage on a volume, so keys survive restarts.
# scripts/sandbox.sh initialises it once, keeping the unseal key and root token in $SDH_SANDBOX/sdh-demo/state,
# unseals it whenever it starts sealed, and gives each stage a token whose policy allows only its own keys.
# Not yet as in production: no TLS, one unseal key rather than shares or auto-unseal, and tokens rather than
# Kubernetes auth through Vault Agent.
apiVersion: v1
kind: ConfigMap
metadata: { name: vault, namespace: sdh-infra }
data:
  vault.hcl: |
    ui = true
    disable_mlock = true
    api_addr = "http://vault.sdh-infra.svc:8200"
    cluster_addr = "http://vault-0.vault-internal.sdh-infra.svc:8201"
    storage "raft" {
      path = "/vault/data"
      node_id = "vault-0"
    }
    listener "tcp" {
      address = "0.0.0.0:8200"
      cluster_address = "0.0.0.0:8201"
      tls_disable = true
    }
---
apiVersion: v1
kind: Service
metadata: { name: vault, namespace: sdh-infra }
spec:
  selector: { app: vault }
  ports: [{ name: api, port: 8200 }]
---
apiVersion: v1
kind: Service
metadata: { name: vault-internal, namespace: sdh-infra }
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: { app: vault }
  ports: [{ name: cluster, port: 8201 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: vault, namespace: sdh-infra }
spec:
  serviceName: vault-internal
  replicas: 1
  selector: { matchLabels: { app: vault } }
  template:
    metadata: { labels: { app: vault } }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: vault
          image: hashicorp/vault:2.1.1
          command: [vault, server, -config=/vault/config/vault.hcl]
          env:
            - { name: VAULT_ADDR, value: "http://127.0.0.1:8200" }
            - { name: SKIP_SETCAP, value: "true" }
          ports:
            - { name: api, containerPort: 8200 }
            - { name: cluster, containerPort: 8201 }
          # Ready only once unsealed: `vault status` exits 2 while sealed.
          readinessProbe: { exec: { command: [vault, status] }, periodSeconds: 5 }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 50m, memory: 192Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: config, mountPath: /vault/config, readOnly: true }
            - { name: data, mountPath: /vault/data }
      volumes:
        - { name: config, configMap: { name: vault } }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 2Gi } }
