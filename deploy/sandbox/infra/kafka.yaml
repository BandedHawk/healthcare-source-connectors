# The broker: three Kafka nodes in KRaft mode (each a broker and a controller), one per cluster node, with every
# topic on all three and writes needing two (min.insync.replicas), so losing a node loses nothing and stops
# nothing. Topics are made by scripts/sandbox.sh, as a customer's broker team would; brokers don't create them.
# Not yet as in production: no TLS or SASL; the network policies limit who can connect.
apiVersion: v1
kind: Service
metadata: { name: kafka, namespace: sdh-infra }
spec:
  clusterIP: None
  publishNotReadyAddresses: true       # the controllers find each other before any is ready
  selector: { app: kafka }
  ports:
    - { name: broker, port: 9092 }
    - { name: controller, port: 9093 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: kafka, namespace: sdh-infra }
spec:
  maxUnavailable: 1
  selector: { matchLabels: { app: kafka } }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: kafka, namespace: sdh-infra }
spec:
  serviceName: kafka
  replicas: 3
  podManagementPolicy: Parallel
  selector: { matchLabels: { app: kafka } }
  template:
    metadata: { labels: { app: kafka } }
    spec:
      # The image turns every KAFKA_* variable into configuration, including the ones Kubernetes would add for
      # the service named kafka.
      enableServiceLinks: false
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector: { matchLabels: { app: kafka } }
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: kafka
          image: apache/kafka:4.2.2
          # The node ID and advertised name come from the pod's ordinal and name (kafka-0, kafka-1, kafka-2).
          command:
            - sh
            - -c
            - |
              export KAFKA_NODE_ID="${HOSTNAME##*-}"
              export KAFKA_ADVERTISED_LISTENERS="PLAINTEXT://${HOSTNAME}.kafka.sdh-infra.svc:9092"
              exec /etc/kafka/docker/run
          env:
            - { name: CLUSTER_ID, value: c2RoLXNhbmRib3gta2ZrMQ }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "0@kafka-0.kafka.sdh-infra.svc:9093,1@kafka-1.kafka.sdh-infra.svc:9093,2@kafka-2.kafka.sdh-infra.svc:9093"
            - { name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data/logs }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false" }
            - { name: KAFKA_DEFAULT_REPLICATION_FACTOR, value: "3" }
            - { name: KAFKA_MIN_INSYNC_REPLICAS, value: "2" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "3" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "3" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "2" }
            - { name: KAFKA_HEAP_OPTS, value: "-Xms384m -Xmx384m" }
          ports:
            - { name: broker, containerPort: 9092 }
            - { name: controller, containerPort: 9093 }
          readinessProbe: { tcpSocket: { port: 9092 }, periodSeconds: 5 }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 200m, memory: 768Mi }
            limits: { memory: 768Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/kafka/data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 20Gi } }
