# A pipeline's split stage: reads items from the bronze bucket, stores their records in split_records in the silver
# bucket, sealed to the convert stage, and announces them on <pipeline>.split. Mounted from the ConfigMap
# splitter-config, as the split stage's README describes. ${...} in capitals with a prefix are filled in by
# scripts/sandbox.sh; ${S3_SECRET_ACCESS_KEY} and ${SDH_LEASE_JDBC_PASSWORD} are left for Spring, from the secret
# splitter-env. Keys are in the secret splitter-keys, at /run/secrets.
sdh:
  connector-id: split-${PIPELINE}
  landing:
    intake: ${PIPELINE}
    storage:
      catalog-name: sdh
      namespace: ${ICEBERG_PREFIX}_landing
      catalog:
        type: jdbc
        uri: jdbc:postgresql://postgres.sdh-infra.svc:5432/sdh
        jdbc.user: splitter_${ICEBERG_PREFIX}
        jdbc.password: ${SDH_LEASE_JDBC_PASSWORD}
        jdbc.schema-version: V1
        warehouse: s3://sdh-bronze/warehouse
        io-impl: org.apache.iceberg.aws.s3.S3FileIO
        # The split stage's key may only read the bronze bucket.
        s3: { endpoint: "http://seaweedfs.sdh-infra.svc:8333", path-style-access: true,
              access-key-id: splitter-${PIPELINE}, secret-access-key: "${S3_SECRET_ACCESS_KEY}" }
        client: { region: us-east-1 }
  stage:
    # The stage adds the options that hold a message until its item is split. The group is the one the splitter
    # had before the stages, so a sandbox made then keeps its place. groupProtocol=consumer (KIP-848, Kafka 4) lets
    # the group rebalance without waiting for a pod busy splitting an item.
    input:
      type: kafka
      uri: "kafka:${PIPELINE}.landed?brokers=${KAFKA_BROKERS}&groupId=splitter-${PIPELINE}&groupProtocol=consumer"
    output:
      type: kafka
      uri: "kafka:${PIPELINE}.split?brokers=${KAFKA_BROKERS}"
    # The stage's own input, which a reprocess sends its items to, sealed to the stage itself (STAGES.md
    # §15.8.4). Kafka has no authentication here yet, so the pods may write it as they are.
    reprocess:
      type: kafka
      uri: "kafka:${PIPELINE}.landed?brokers=${KAFKA_BROKERS}"
    registry-schema: split_${ICEBERG_PREFIX}
  split:
    format: ${SPLIT_FORMAT}
  storage:
    catalog-name: sdh
    namespace: ${ICEBERG_PREFIX}
    catalog:
      type: jdbc
      uri: jdbc:postgresql://postgres.sdh-infra.svc:5432/sdh
      jdbc.user: splitter_${ICEBERG_PREFIX}
      jdbc.password: ${SDH_LEASE_JDBC_PASSWORD}
      jdbc.schema-version: V1
      warehouse: s3://sdh-silver/warehouse
      io-impl: org.apache.iceberg.aws.s3.S3FileIO
      s3: { endpoint: "http://seaweedfs.sdh-infra.svc:8333", path-style-access: true,
            access-key-id: splitter-${PIPELINE}, secret-access-key: "${S3_SECRET_ACCESS_KEY}" }
      client: { region: us-east-1 }
  lease:
    jdbc: { url: "jdbc:postgresql://postgres.sdh-infra.svc:5432/sdh", username: splitter_${ICEBERG_PREFIX} }
  crypto:
    wrap-provider: vault-transit
    sign-provider: vault-transit
    vault: { address: "http://vault.sdh-infra.svc:8200", token-file: /run/secrets/vault-token }
    keys:
      records-kek: ${PIPELINE}-records
      landed-items-kek: ${PIPELINE}-landed-items
      signing: { kid: splitter-${PIPELINE}, key-ref: ${PIPELINE}-splitter-signing }
      # The convert stage's inbox: record.split and item.split are sealed to it.
      recipient: { kid: convert-${PIPELINE}-inbox, pem: /run/secrets/recipient.pem, sha256: "${CONVERT_INBOX_SHA256}" }
      # Its public half too, pinned, so the stage can seal a reprocess to itself; the signing key's comes from
      # Vault.
      inbox: { kid: splitter-${PIPELINE}-inbox, pem: /run/secrets/inbox.pem, public-pem: /run/secrets/inbox-public.pem,
               sha256: "${INBOX_SHA256}" }
      landing-signer: { kid: landing-${PIPELINE}, pem: /run/secrets/landing-signer.pem }
  telemetry:
    otlp: { endpoint: "http://otel-collector.sdh-infra.svc:4318" }
