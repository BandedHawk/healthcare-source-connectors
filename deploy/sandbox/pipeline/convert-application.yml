# A pipeline's convert stage: reads the split stage's records from split_records in the silver bucket, converts
# each to JSON, stores it in records in the same bucket, sealed to the FHIR stage (the recipient), and announces it
# on <pipeline>.records. Mounted from the ConfigMap convert-config, as the convert stage's README describes. ${...}
# in capitals with a prefix are filled in by scripts/sandbox.sh; ${S3_SECRET_ACCESS_KEY} and
# ${SDH_LEASE_JDBC_PASSWORD} are left for Spring, from the secret convert-env. Keys are in the secret
# convert-keys, at /run/secrets.
sdh:
  connector-id: convert-${PIPELINE}
  stage:
    input:
      # groupProtocol=consumer (KIP-848, Kafka 4): a rebalance doesn't wait for every pod's next poll.
      type: kafka
      uri: "kafka:${PIPELINE}.split?brokers=${KAFKA_BROKERS}&groupId=convert-${PIPELINE}&groupProtocol=consumer"
    output:
      type: kafka
      uri: "kafka:${PIPELINE}.records?brokers=${KAFKA_BROKERS}"
    dlq:
      type: kafka
      uri: "kafka:${PIPELINE}.convert.dlq?brokers=${KAFKA_BROKERS}"
    # The stage's own input, which a reprocess sends its objects to, sealed to the stage itself (STAGES.md
    # §15.8.4). Kafka has no authentication here yet, so the pods may write it as they are.
    reprocess:
      type: kafka
      uri: "kafka:${PIPELINE}.split?brokers=${KAFKA_BROKERS}"
    registry-schema: convert_${ICEBERG_PREFIX}
    # Reads split_records and stores in records (the convert stage's defaults), both in the silver bucket: the
    # sink has no catalog of its own, so it shares the source's (STAGES.md §17.7).
    source:
      catalog-name: sdh
      namespace: ${ICEBERG_PREFIX}
      catalog:
        type: jdbc
        uri: jdbc:postgresql://postgres.sdh-infra.svc:5432/sdh
        jdbc.user: convert_${ICEBERG_PREFIX}
        jdbc.password: ${SDH_LEASE_JDBC_PASSWORD}
        jdbc.schema-version: V1
        warehouse: s3://sdh-silver/warehouse
        io-impl: org.apache.iceberg.aws.s3.S3FileIO
        # The convert stage's key may use only the silver bucket.
        s3: { endpoint: "http://seaweedfs.sdh-infra.svc:8333", path-style-access: true,
              access-key-id: convert-${PIPELINE}, secret-access-key: "${S3_SECRET_ACCESS_KEY}" }
        client: { region: us-east-1 }
    sink:
      catalog-name: sdh
      namespace: ${ICEBERG_PREFIX}
  lease:
    jdbc: { url: "jdbc:postgresql://postgres.sdh-infra.svc:5432/sdh", username: convert_${ICEBERG_PREFIX} }
  crypto:
    wrap-provider: vault-transit
    sign-provider: vault-transit
    vault: { address: "http://vault.sdh-infra.svc:8200", token-file: /run/secrets/vault-token }
    keys:
      records-kek: ${PIPELINE}-records
      signing: { kid: convert-${PIPELINE}, key-ref: ${PIPELINE}-convert-signing }
      recipient: { kid: fhir-${PIPELINE}, pem: /run/secrets/recipient.pem, sha256: "${RECIPIENT_SHA256}" }
      # Its public half too, pinned, so the stage can seal a reprocess to itself; the signing key's comes from
      # Vault.
      inbox: { kid: convert-${PIPELINE}-inbox, pem: /run/secrets/inbox.pem, public-pem: /run/secrets/inbox-public.pem,
               sha256: "${CONVERT_INBOX_SHA256}" }
      landing-signer: { kid: splitter-${PIPELINE}, pem: /run/secrets/split-signer.pem }
  telemetry:
    otlp: { endpoint: "http://otel-collector.sdh-infra.svc:4318" }
