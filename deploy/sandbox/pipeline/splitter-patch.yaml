# The splitter README's Deployment, with requests: its memory is reserved on the node, as its limit. 1.5 GiB (a
# 768 MiB heap), not the README's 2 GiB, so a pod fits beside the rest on the sandbox's nodes (docs/SANDBOX.md
# "Memory"); the sample documents are small.
apiVersion: apps/v1
kind: Deployment
metadata: { name: splitter }
spec:
  # The old pod stops before the new one starts: with one pod, and the other stage's node forbidden, a new pod
  # can't be placed beside the old. The stage pauses for the restart; its messages wait in Kafka.
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }
  template:
    spec:
      # The split pod and the convert pod on different workers, each stage held to one pod: whichever worker also
      # holds the landing pod, the collector and the producer then has room for a transform pod (docs/SANDBOX.md
      # "Memory").
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector: { matchLabels: { app: convert } }
              topologyKey: kubernetes.io/hostname
      containers:
        - name: file-connector
          # Ready once the drain check lets its release in (docs/STAGES.md §14.4a), as the README's Deployment.
          ports:
            - { name: ready, containerPort: 8081 }
          readinessProbe:
            tcpSocket: { port: ready }
            periodSeconds: 10
          resources:
            requests: { cpu: 500m, memory: 1536Mi }
            limits: { memory: 1536Mi }
