# The convert stage README's Deployment, with requests: its memory is reserved on the node, as its limit. 1 GiB,
# not the README's 2 GiB, so a pipeline fits on the sandbox's nodes; the sample documents are small.
apiVersion: apps/v1
kind: Deployment
metadata: { name: convert }
spec:
  template:
    spec:
      # A stage's two pods on different nodes: each node then has room for one pod of each stage beside the rest,
      # however the pods arrive (docs/SANDBOX.md "Memory").
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector: { matchLabels: { app: convert } }
              topologyKey: kubernetes.io/hostname
      containers:
        - name: convert-stage
          resources:
            requests: { cpu: 250m, memory: 1Gi }
            limits: { memory: 1Gi }
