# The landing README's Deployment, for a push intake on a cluster of several nodes.
apiVersion: apps/v1
kind: Deployment
metadata: { name: landing }
spec:
  # Only the active node is ready (its push port opens once it holds the lease), so a rolling update could never
  # make a new pod ready while the old active node lives: both are replaced together, and the first new pod to
  # get the lease lands. Producers see refusals for that time, and retry.
  strategy: { type: Recreate, rollingUpdate: null }
  template:
    spec:
      # The active node and the standby on different nodes, so losing a node fails over.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector: { matchLabels: { app: landing } }
              topologyKey: kubernetes.io/hostname
      volumes:
        - { name: intake, $patch: delete }     # pushed, not picked up from a directory
      containers:
        - name: landing-connector
          ports: [{ name: push, containerPort: 8443 }]
          # The Service sends pushes to the active node only.
          readinessProbe: { tcpSocket: { port: 8443 }, periodSeconds: 5 }
          resources:
            requests: { cpu: 250m, memory: 1Gi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { mountPath: /data/intake, $patch: delete }
