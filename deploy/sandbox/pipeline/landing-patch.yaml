# The landing README's Deployment, for a push intake, as one pod with no standby (decided 2026-11-07, to fit the
# sandbox's memory, docs/SANDBOX.md "Memory"). Kubernetes starts a new pod if it dies, on another node if its
# node is gone; the new pod lands once the old pod's lease has expired. Never more than one: landing in parallel
# could land a file twice.
apiVersion: apps/v1
kind: Deployment
metadata: { name: landing }
spec:
  replicas: 1
  # The pod is ready only once it holds the lease (its push port opens then), so a rolling update could never
  # make a new pod ready while the old one lives: the old one is stopped first, and the new one lands once it has
  # the lease. Producers see refusals for that time, and retry.
  strategy: { type: Recreate, rollingUpdate: null }
  template:
    spec:
      volumes:
        - { name: intake, $patch: delete }     # pushed, not picked up from a directory
      containers:
        - name: landing-connector
          ports: [{ name: push, containerPort: 8443 }]
          # The Service sends pushes to the active node only.
          readinessProbe: { tcpSocket: { port: 8443 }, periodSeconds: 5 }
          resources:
            requests: { cpu: 250m, memory: 1Gi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { mountPath: /data/intake, $patch: delete }
