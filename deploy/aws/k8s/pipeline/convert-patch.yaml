# The convert stage README's Deployment on AWS (docs/AWS-POC.md §5): 1.25 GiB; KEDA 1-3 pods.
apiVersion: apps/v1
kind: Deployment
metadata: { name: convert }
spec:
  template:
    spec:
      serviceAccountName: convert
      automountServiceAccountToken: false
      # Base nodes first; KEDA's extra pods may go to the Spot burst nodes, which the cluster autoscaler adds
      # for them (docs/AWS-POC.md §4). A Spot reclaim costs only the work in flight: its messages are delivered
      # again.
      tolerations:
        - { key: sdh-poc/burst, operator: Equal, value: "true", effect: NoSchedule }
      # Time to finish the batch in hand and hand back its records' claims (STAGES.md §10) and any duties lease,
      # within the two minutes' notice of a Spot reclaim, so another pod takes them up at once (2026-11-18).
      terminationGracePeriodSeconds: 90
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference: { matchExpressions: [{ key: sdh-poc/pool, operator: In, values: [base] }] }
      containers:
        - name: convert-stage
          # Each pod's own metrics series (k8s/infra/telemetry.yaml): without an instance, two pods' counters
          # interleave in one series and Prometheus reads each drop as a reset.
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - { name: OTEL_RESOURCE_ATTRIBUTES, value: "service.instance.id=$(POD_NAME)" }
            # The duties are the duties pod's (duties-patch.yaml); this pod takes them up only once their lease has
            # been free 3 minutes, and hands them back after 30 (STAGES.md §8, DESIGN.md revision (dz)).
            - { name: SDH_STAGE_DUTIES_FALLBACKAFTER, value: 3m }
          # CPU near what a pod uses under load (docs/PERFORMANCE.md §10, 2026-11-14): asking for less packed pods onto
          # too few CPUs, and they waited for them.
          resources:
            requests: { cpu: 400m, memory: 1280Mi }
            limits: { memory: 1280Mi }
