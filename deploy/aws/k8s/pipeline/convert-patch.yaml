# The convert stage README's Deployment on AWS (docs/AWS-POC.md §5): 1.25 GiB; KEDA 1-3 pods.
apiVersion: apps/v1
kind: Deployment
metadata: { name: convert }
spec:
  template:
    spec:
      serviceAccountName: convert
      automountServiceAccountToken: false
      # Base nodes first; KEDA's extra pods may go to the Spot burst nodes, which the cluster autoscaler adds
      # for them (docs/AWS-POC.md §4). A Spot reclaim costs only the work in flight: its messages are delivered
      # again.
      tolerations:
        - { key: sdh-poc/burst, operator: Equal, value: "true", effect: NoSchedule }
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference: { matchExpressions: [{ key: sdh-poc/pool, operator: In, values: [base] }] }
      containers:
        - name: convert-stage
          resources:
            requests: { cpu: 250m, memory: 1280Mi }
            limits: { memory: 1280Mi }
