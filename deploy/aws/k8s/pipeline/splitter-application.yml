# A pipeline's split stage on AWS (docs/AWS-POC.md §5): reads items from the bronze bucket, stores their records in
# split_records in the silver bucket, sealed to the convert stage, and announces them on <pipeline>.split. As
# deploy/sandbox/pipeline/splitter-application.yml, with S3 through the pod's role (EKS Pod Identity; it may only
# read bronze), AWS KMS for the keys, and metrics to the collector. ${...} in capitals are filled in by
# deploy/aws/k8s/pipeline/apply.sh; ${SDH_LEASE_JDBC_PASSWORD} is left for Spring, from the secret splitter-env.
# Keys are in the secret splitter-keys, at /run/secrets.
sdh:
  # The PoC holds synthetic data only (docs/AWS-POC.md §9), with Kafka, Postgres and the collector in plaintext: the
  # HIPAA profile is off (design §7.6). Real PHI needs it at its default, hipaa, and the changes HIPAA.md §8.5 lists.
  compliance: { profile: none }
  connector-id: split-${PIPELINE}
  # Metrics for measuring the pipeline (docs/PERFORMANCE.md §10); the collector drops traces and logs.
  telemetry:
    otlp: { endpoint: "http://otel-collector.sdh-infra.svc:4318" }
    metric-interval: 15s
    # Waits up to this long to write a fuller batch of audit events (docs/PERFORMANCE.md §13); apply.sh fills it.
    journal: { linger: ${JOURNAL_LINGER} }
  landing:
    intake: ${PIPELINE}
    reconcile: { grace: ${SPLIT_RECONCILE_GRACE}, interval: ${SPLIT_RECONCILE_INTERVAL} }
    storage:
      catalog-name: sdh
      namespace: ${ICEBERG_PREFIX}_landing
      catalog:
        type: jdbc
        uri: jdbc:postgresql://pgbouncer.sdh-infra.svc:5432/sdh
        jdbc.user: splitter_${ICEBERG_PREFIX}
        jdbc.password: ${SDH_LEASE_JDBC_PASSWORD}
        jdbc.schema-version: V1
        warehouse: s3://${BRONZE_BUCKET}/warehouse
        io-impl: org.apache.iceberg.aws.s3.S3FileIO
        client: { region: ${AWS_REGION} }
        # Read only, so one Postgres connection, not Iceberg's two: with the stages scaled out, ~36 pods' pools
        # came within 28 of max_connections (docs/PERFORMANCE.md §10, 2026-11-18).
        clients: 1
  stage:
    # groupProtocol=consumer (KIP-848, Kafka 4): the group rebalances without waiting for a pod busy splitting.
    input:
      type: kafka
      uri: "kafka:${PIPELINE}.landed?brokers=${KAFKA_BROKERS}&groupId=splitter-${PIPELINE}&groupProtocol=consumer"
    output:
      type: kafka
      uri: "kafka:${PIPELINE}.split?brokers=${KAFKA_BROKERS}"
    # The stage's own input, which a reprocess sends its items to (STAGES.md §15.8.4).
    reprocess:
      type: kafka
      uri: "kafka:${PIPELINE}.landed?brokers=${KAFKA_BROKERS}"
    registry-schema: split_${ICEBERG_PREFIX}
    # The next stage's registry, where its reconciler marks items whose end from this stage never came, for this
    # stage to send it again (STAGES.md §13.2, 2026-11-16).
    next-registry-schema: convert_${ICEBERG_PREFIX}
  split:
    # ccda unless a load test of another format asks (apply.sh SDH_SPLIT_FORMAT, SDH_SPLIT_OPTIONS).
    format: ${SPLIT_FORMAT}
    options: ${SPLIT_OPTIONS}
    # 8 Kafka consumers, each with batches of 8: 64 items at once, and a slow item holds back only its own batch
    # (docs/PERFORMANCE.md §3.4). 6 pods × 8 consumers fill the topic's 48 partitions (poc.sh STAGE_PARTITIONS).
    # Four since 2026-11-17 (§10; two before): an item mostly waits for the shared commit, which takes every pod's
    # waiting groups at once, so twice as many at once split ~70 items a second at 6 pods, not ~31. Eight since
    # 2026-11-18: at four, 1.26 s of an item's 2.16 s was the append (queue 0.45, group commit 0.79), and a pod
    # used ~0.65 of a core.
    concurrency: 8
    consumers: 8
    # One group of a pod's files waits for the shared commit at a time (the default). Four at once was tried
    # (docs/PERFORMANCE.md §10, runs 45-46, 2026-11-18): a turn took ~6.7 groups, not ~2.6, but each group was
    # smaller and took its own turn, turns slowed to 1.03 s (0.58), and split fell from 70 items a second to 61.
  storage:
    catalog-name: sdh
    namespace: ${ICEBERG_PREFIX}
    catalog:
      type: jdbc
      uri: jdbc:postgresql://pgbouncer.sdh-infra.svc:5432/sdh
      jdbc.user: splitter_${ICEBERG_PREFIX}
      jdbc.password: ${SDH_LEASE_JDBC_PASSWORD}
      jdbc.schema-version: V1
      warehouse: s3://${SILVER_BUCKET}/warehouse
      io-impl: org.apache.iceberg.aws.s3.S3FileIO
      client: { region: ${AWS_REGION} }
  lease:
    # pool-size: the pool for the registry, leases and checkpoints (2 unless a load test asks: apply.sh
    # SDH_SPLIT_POOL_SIZE; docs/PERFORMANCE.md §13.3).
    jdbc: { url: "jdbc:postgresql://pgbouncer.sdh-infra.svc:5432/sdh", username: splitter_${ICEBERG_PREFIX},
            pool-size: ${SPLIT_POOL_SIZE} }
  crypto:
    # The JCA provider for message sealing (docs/PERFORMANCE.md §13): accp on AWS; apply.sh fills it.
    jose: { provider: ${JOSE_PROVIDER} }
    wrap-provider: aws-kms
    sign-provider: aws-kms
    aws: { region: ${AWS_REGION} }
    keys:
      records-kek: alias/sdh-poc-${PIPELINE}-records
      landed-items-kek: alias/sdh-poc-${PIPELINE}-landed-items
      signing: { kid: splitter-${PIPELINE}, key-ref: alias/sdh-poc-${PIPELINE}-splitter-signing }
      # The convert stage's inbox: record.split and item.split are sealed to it.
      recipient: { kid: convert-${PIPELINE}-inbox, pem: /run/secrets/recipient.pem, sha256: "${CONVERT_INBOX_SHA256}" }
      # Its own inbox, with the public half pinned, so it can seal a reprocess to itself.
      inbox: { kid: splitter-${PIPELINE}-inbox, pem: /run/secrets/inbox.pem, public-pem: /run/secrets/inbox-public.pem,
               sha256: "${INBOX_SHA256}" }
      # The landing node's KMS signing key's public half, exported by apply.sh.
      landing-signer: { kid: landing-${PIPELINE}, pem: /run/secrets/landing-signer.pem }
