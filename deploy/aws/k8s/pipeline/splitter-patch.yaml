# The split stage README's Deployment on AWS (docs/AWS-POC.md §5): 2 GiB, the README's size; KEDA 1-2 pods.
apiVersion: apps/v1
kind: Deployment
metadata: { name: splitter }
spec:
  template:
    spec:
      serviceAccountName: splitter
      automountServiceAccountToken: false
      # Base nodes first; KEDA's extra pods may go to the Spot burst nodes, which the cluster autoscaler adds
      # for them (docs/AWS-POC.md §4). A Spot reclaim costs only the work in flight: its messages are delivered
      # again.
      tolerations:
        - { key: sdh-poc/burst, operator: Equal, value: "true", effect: NoSchedule }
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference: { matchExpressions: [{ key: sdh-poc/pool, operator: In, values: [base] }] }
      containers:
        - name: file-connector
          # Each pod's own metrics series (k8s/infra/telemetry.yaml): without an instance, two pods' counters
          # interleave in one series and Prometheus reads each drop as a reset.
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - { name: OTEL_RESOURCE_ATTRIBUTES, value: "service.instance.id=$(POD_NAME)" }
          resources:
            requests: { cpu: 500m, memory: 2Gi }
            limits: { memory: 2Gi }
