# A pipeline's landing node on AWS (docs/AWS-POC.md §5): a bucket intake (DESIGN.md §5.3.17) on the intake bucket,
# under <pipeline>/, landing into the bronze bucket. As deploy/sandbox/pipeline/landing-application.yml, with:
#   - the bucket intake in place of HTTP push, claimed by a conditional write (.sdh-owner), so a second node on
#     the same bucket stops at its next listing;
#   - S3 itself, with the pod's role through EKS Pod Identity, in place of SeaweedFS and an access key;
#   - AWS KMS in place of Vault Transit;
#   - metrics only to the collector (k8s/infra/telemetry.yaml); audit events go to the console.
# ${...} in capitals are filled in by deploy/aws/k8s/pipeline/apply.sh; ${SDH_LEASE_JDBC_PASSWORD} is left for
# Spring, from the secret landing-env. Keys are in the secret landing-keys, at /run/secrets.
sdh:
  # The HIPAA profile on, nothing waived, since DESIGN.md revision (fk), as deploy/reference/ sets it: Kafka over
  # SASL_SSL with this stage's SCRAM login (SDH_KAFKA_JAAS, from its env secret), Postgres (through PgBouncer) with
  # verify-full, both servers' CA at /run/secrets. So a run measures what a production deployment would do.
  compliance: { profile: hipaa }
  connector-id: landing-${PIPELINE}
  # Metrics for measuring the pipeline (docs/PERFORMANCE.md §10); the collector drops traces and logs.
  telemetry:
    otlp: { endpoint: "http://otel-collector.sdh-infra.svc:4318" }
    metric-interval: 15s
    # Waits up to this long to write a fuller batch of audit events (docs/PERFORMANCE.md §13); apply.sh fills it.
    journal: { linger: ${JOURNAL_LINGER} }
  landing:
    intake: ${PIPELINE}
    source:
      type: s3
      path: /${PIPELINE}
      bucket: { name: ${INTAKE_BUCKET}, region: ${AWS_REGION} }
      # Read-write, so the bucket is claimed, and each object is deleted once landed: landing keeps it.
      access: read-write
      after: delete
      # Objects appear whole, so they are landed as soon as listed. (Until 2026-11-13 this was written as nested
      # keys, which these flat settings ignore, so landing waited the default settle, 2 minutes, after each start.)
      ready: settled
      settle: 0s
      recursive: false
      max-item-bytes: 104857600
  storage:
    catalog-name: sdh
    namespace: ${ICEBERG_PREFIX}_landing
    # Small items landed 500 a commit (docs/PERFORMANCE.md §3.4), 32 read, deleted and sealed at once. 32 since
    # 2026-11-17 (§10; the default 8 before): at 8, a group of ~480 waited 3.6 s on reads and 2.6 s on deletes, S3
    # round trips, and landing held at ~54 items a second. 32 is within the S3 client's 50 connections, and holds
    # at most 32 items of up to 8 MB in memory.
    group: { concurrency: 32 }
    catalog:
      type: jdbc
      uri: "jdbc:postgresql://pgbouncer.sdh-infra.svc:5432/sdh?sslmode=verify-full&sslrootcert=/run/secrets/postgres-ca.crt"
      jdbc.user: landing_${ICEBERG_PREFIX}
      jdbc.password: ${SDH_LEASE_JDBC_PASSWORD}
      jdbc.schema-version: V1
      warehouse: s3://${BRONZE_BUCKET}/warehouse
      io-impl: org.apache.iceberg.aws.s3.S3FileIO
      client: { region: ${AWS_REGION} }
  lease:
    jdbc: { url: "jdbc:postgresql://pgbouncer.sdh-infra.svc:5432/sdh?sslmode=verify-full&sslrootcert=/run/secrets/postgres-ca.crt", username: landing_${ICEBERG_PREFIX} }
  crypto:
    # The JCA provider for message sealing (docs/PERFORMANCE.md §13): accp on AWS; apply.sh fills it.
    jose: { provider: ${JOSE_PROVIDER} }
    wrap-provider: aws-kms
    sign-provider: aws-kms
    aws: { region: ${AWS_REGION} }
    keys:
      landed-items-kek: alias/sdh-poc-${PIPELINE}-landed-items
      signing: { kid: landing-${PIPELINE}, key-ref: alias/sdh-poc-${PIPELINE}-landing-signing }
      recipient: { kid: splitter-${PIPELINE}-inbox, pem: /run/secrets/splitter-inbox.pem, sha256: "${INBOX_SHA256}" }
  queue:
    type: kafka
    uri: "kafka:${PIPELINE}.landed?brokers=${KAFKA_BROKERS}&securityProtocol=SASL_SSL&saslMechanism=SCRAM-SHA-512&saslJaasConfig=RAW({{env:SDH_KAFKA_JAAS}})&sslTruststoreType=PEM&sslTruststoreLocation=/run/secrets/kafka-ca.crt"
