# A pipeline's landing node on AWS (docs/AWS-POC.md §5): a bucket intake (DESIGN.md §5.3.17) on the intake bucket,
# under <pipeline>/, landing into the bronze bucket. As deploy/sandbox/pipeline/landing-application.yml, with:
#   - the bucket intake in place of HTTP push, claimed by a conditional write (.sdh-owner), so a second node on
#     the same bucket stops at its next listing;
#   - S3 itself, with the pod's role through EKS Pod Identity, in place of SeaweedFS and an access key;
#   - AWS KMS in place of Vault Transit;
#   - no telemetry collector: audit events go to the console.
# ${...} in capitals are filled in by deploy/aws/k8s/pipeline/apply.sh; ${SDH_LEASE_JDBC_PASSWORD} is left for
# Spring, from the secret landing-env. Keys are in the secret landing-keys, at /run/secrets.
sdh:
  connector-id: landing-${PIPELINE}
  landing:
    intake: ${PIPELINE}
    source:
      type: s3
      path: /${PIPELINE}
      bucket: { name: ${INTAKE_BUCKET}, region: ${AWS_REGION} }
      # Read-write, so the bucket is claimed, and each object is deleted once landed: landing keeps it.
      access: read-write
      after: { mode: delete }
      # Objects appear whole.
      ready: { mode: stable, settle: 0s }
      recursive: false
      max-item-bytes: 104857600
  storage:
    catalog-name: sdh
    namespace: ${ICEBERG_PREFIX}_landing
    catalog:
      type: jdbc
      uri: jdbc:postgresql://postgres.sdh-infra.svc:5432/sdh
      jdbc.user: landing_${ICEBERG_PREFIX}
      jdbc.password: ${SDH_LEASE_JDBC_PASSWORD}
      jdbc.schema-version: V1
      warehouse: s3://${BRONZE_BUCKET}/warehouse
      io-impl: org.apache.iceberg.aws.s3.S3FileIO
      client: { region: ${AWS_REGION} }
  lease:
    jdbc: { url: "jdbc:postgresql://postgres.sdh-infra.svc:5432/sdh", username: landing_${ICEBERG_PREFIX} }
  crypto:
    wrap-provider: aws-kms
    sign-provider: aws-kms
    aws: { region: ${AWS_REGION} }
    keys:
      landed-items-kek: alias/sdh-poc-${PIPELINE}-landed-items
      signing: { kid: landing-${PIPELINE}, key-ref: alias/sdh-poc-${PIPELINE}-landing-signing }
      recipient: { kid: splitter-${PIPELINE}-inbox, pem: /run/secrets/splitter-inbox.pem, sha256: "${INBOX_SHA256}" }
  queue:
    type: kafka
    uri: "kafka:${PIPELINE}.landed?brokers=${KAFKA_BROKERS}"
