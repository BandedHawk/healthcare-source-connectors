# A pipeline's convert stage on AWS (docs/AWS-POC.md §5): reads split_records in the silver bucket, converts each
# record to JSON, stores it in records in the same bucket, sealed to the transform stage, and announces it on
# <pipeline>.records. As deploy/sandbox/pipeline/convert-application.yml, with S3 through the pod's role (EKS Pod
# Identity; silver only), AWS KMS for the keys, and metrics to the collector. ${...} in capitals are filled in by
# deploy/aws/k8s/pipeline/apply.sh; ${SDH_LEASE_JDBC_PASSWORD} is left for Spring, from the secret convert-env.
# Keys are in the secret convert-keys, at /run/secrets.
sdh:
  # The HIPAA profile on, nothing waived, since DESIGN.md revision (fk), as deploy/reference/ sets it: Kafka over
  # SASL_SSL with this stage's SCRAM login (SDH_KAFKA_JAAS, from its env secret), Postgres (through PgBouncer) with
  # verify-full, both servers' CA at /run/secrets. So a run measures what a production deployment would do.
  compliance: { profile: hipaa }
  connector-id: convert-${PIPELINE}
  # Metrics for measuring the pipeline (docs/PERFORMANCE.md §10); the collector drops traces and logs.
  telemetry:
    otlp: { endpoint: "http://otel-collector.sdh-infra.svc:4318" }
    metric-interval: 15s
    # Waits up to this long to write a fuller batch of audit events (docs/PERFORMANCE.md §13); apply.sh fills it.
    journal: { linger: ${JOURNAL_LINGER} }
  # The transform stage, the last, sends the producer's results; here they are off (its README). No producer
  # listens on AWS, so they are off there too (docs/AWS-POC.md §5).
  results: { enabled: false }
  # Format options (apply.sh SDH_CONVERT_OPTIONS): none for C-CDA.
  convert: { options: ${CONVERT_OPTIONS} }
  stage:
    input:
      type: kafka
      uri: "kafka:${PIPELINE}.split?brokers=${KAFKA_BROKERS}&groupId=convert-${PIPELINE}&groupProtocol=consumer&securityProtocol=SASL_SSL&saslMechanism=SCRAM-SHA-512&saslJaasConfig=RAW({{env:SDH_KAFKA_JAAS}})&sslTruststoreType=PEM&sslTruststoreLocation=/run/secrets/kafka-ca.crt"
    output:
      type: kafka
      uri: "kafka:${PIPELINE}.records?brokers=${KAFKA_BROKERS}&securityProtocol=SASL_SSL&saslMechanism=SCRAM-SHA-512&saslJaasConfig=RAW({{env:SDH_KAFKA_JAAS}})&sslTruststoreType=PEM&sslTruststoreLocation=/run/secrets/kafka-ca.crt"
    dlq:
      type: kafka
      uri: "kafka:${PIPELINE}.convert.dlq?brokers=${KAFKA_BROKERS}&securityProtocol=SASL_SSL&saslMechanism=SCRAM-SHA-512&saslJaasConfig=RAW({{env:SDH_KAFKA_JAAS}})&sslTruststoreType=PEM&sslTruststoreLocation=/run/secrets/kafka-ca.crt"
    reprocess:
      type: kafka
      uri: "kafka:${PIPELINE}.split?brokers=${KAFKA_BROKERS}&securityProtocol=SASL_SSL&saslMechanism=SCRAM-SHA-512&saslJaasConfig=RAW({{env:SDH_KAFKA_JAAS}})&sslTruststoreType=PEM&sslTruststoreLocation=/run/secrets/kafka-ca.crt"
    registry-schema: convert_${ICEBERG_PREFIX}
    # The next stage's registry, where its reconciler marks items whose end from this stage never came, for this
    # stage to send it again (STAGES.md §13.2, 2026-11-16).
    next-registry-schema: transform_${ICEBERG_PREFIX}
    # Reads split_records and stores in records, both in silver: the sink shares the source's catalog
    # (STAGES.md §17.7).
    source:
      catalog-name: sdh
      namespace: ${ICEBERG_PREFIX}
      catalog:
        type: jdbc
        uri: "jdbc:postgresql://pgbouncer.sdh-infra.svc:5432/sdh?sslmode=verify-full&sslrootcert=/run/secrets/postgres-ca.crt"
        jdbc.user: convert_${ICEBERG_PREFIX}
        jdbc.password: ${SDH_LEASE_JDBC_PASSWORD}
        jdbc.schema-version: V1
        warehouse: s3://${SILVER_BUCKET}/warehouse
        io-impl: org.apache.iceberg.aws.s3.S3FileIO
        client: { region: ${AWS_REGION} }
    sink:
      catalog-name: sdh
      namespace: ${ICEBERG_PREFIX}
  lease:
    jdbc: { url: "jdbc:postgresql://pgbouncer.sdh-infra.svc:5432/sdh?sslmode=verify-full&sslrootcert=/run/secrets/postgres-ca.crt", username: convert_${ICEBERG_PREFIX} }
  crypto:
    # The JCA provider for message sealing (docs/PERFORMANCE.md §13): accp on AWS; apply.sh fills it.
    jose: { provider: ${JOSE_PROVIDER} }
    wrap-provider: aws-kms
    sign-provider: aws-kms
    aws: { region: ${AWS_REGION} }
    keys:
      records-kek: alias/sdh-poc-${PIPELINE}-records
      signing: { kid: convert-${PIPELINE}, key-ref: alias/sdh-poc-${PIPELINE}-convert-signing }
      recipient: { kid: fhir-${PIPELINE}, pem: /run/secrets/recipient.pem, sha256: "${RECIPIENT_SHA256}" }
      inbox: { kid: convert-${PIPELINE}-inbox, pem: /run/secrets/inbox.pem, public-pem: /run/secrets/inbox-public.pem,
               sha256: "${CONVERT_INBOX_SHA256}" }
      landing-signer: { kid: splitter-${PIPELINE}, pem: /run/secrets/split-signer.pem }
