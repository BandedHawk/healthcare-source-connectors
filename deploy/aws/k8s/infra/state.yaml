# Postgres and Kafka on the EBS volumes that the persistent Terraform layer keeps, so their data outlives each
# cluster. poc.sh fills in ${POSTGRES_VOLUME_ID}, ${KAFKA_VOLUME_ID} and ${STATE_ZONE} (with envsubst).
#
# Each PersistentVolume is static, with Retain, and is bound to the claim that its StatefulSet's template would
# create (data-postgres-0, data-kafka-0). So the StatefulSet picks up the old data instead of an empty disk.
apiVersion: v1
kind: PersistentVolume
metadata: { name: sdh-poc-postgres }
spec:
  capacity: { storage: 10Gi }
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef: { namespace: sdh-infra, name: data-postgres-0 }
  csi: { driver: ebs.csi.aws.com, volumeHandle: "${POSTGRES_VOLUME_ID}", fsType: ext4 }
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions: [{ key: topology.kubernetes.io/zone, operator: In, values: ["${STATE_ZONE}"] }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: data-postgres-0, namespace: sdh-infra }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  volumeName: sdh-poc-postgres
  resources: { requests: { storage: 10Gi } }
---
apiVersion: v1
kind: PersistentVolume
metadata: { name: sdh-poc-kafka }
spec:
  capacity: { storage: 10Gi }
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef: { namespace: sdh-infra, name: data-kafka-0 }
  csi: { driver: ebs.csi.aws.com, volumeHandle: "${KAFKA_VOLUME_ID}", fsType: ext4 }
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions: [{ key: topology.kubernetes.io/zone, operator: In, values: ["${STATE_ZONE}"] }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: data-kafka-0, namespace: sdh-infra }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  volumeName: sdh-poc-kafka
  resources: { requests: { storage: 10Gi } }
---
# The catalog and lease database, as in the sandbox (deploy/sandbox/infra/postgres.yaml). The superuser
# password is in the secret postgres, which poc.sh makes from its state directory.
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: sdh-infra }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres, namespace: sdh-infra }
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      nodeSelector: { "sdh-poc/pool": base, topology.kubernetes.io/zone: "${STATE_ZONE}" }
      terminationGracePeriodSeconds: 60   # a clean shutdown checkpoints, so the next start skips recovery
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: postgres:18.4
          env:
            - { name: POSTGRES_DB, value: sdh }
            - { name: POSTGRES_USER, value: postgres }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres, key: password } }
          # 300 connections since 2026-11-17: with the stages scaled out (splitter 6, convert 12, transform 15) they
          # used 188 of 200 (docs/PERFORMANCE.md §10); an idle backend is a few MB, within the 2 GiB below. Since
          # revision (ea) the stages come through PgBouncer (below), which keeps at most 220 of them.
          args: [-c, max_connections=300, -c, shared_buffers=128MB]
          ports: [{ containerPort: 5432 }]
          readinessProbe: { exec: { command: [pg_isready, -U, postgres, -d, sdh] }, periodSeconds: 5 }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          # 2 GiB and half a CPU since 2026-11-17 (docs/PERFORMANCE.md §10, the first steady feed): with the
          # stages scaled out, ~35 pods' pools come near max_connections, and 200 backends don't fit in 512 MiB.
          resources:
            requests: { cpu: 500m, memory: 2Gi }
            limits: { memory: 2Gi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql }
            - { name: run, mountPath: /var/run/postgresql }
      volumes:
        - { name: run, emptyDir: {} }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: ""
        resources: { requests: { storage: 10Gi } }
---
# PgBouncer in front of Postgres (DESIGN.md revision (ea), 2026-11-19): every stage pod's pools, Iceberg's catalog
# clients and the landing pods connect here, and it keeps only as many Postgres connections as there are
# transactions in flight. Without it the backends grow with the pods (241 of max_connections 300 at 6/12/18 pods,
# run 49) though most sit idle; with it they grow with the work, and a buyer can scale the stages out without
# raising max_connections or Postgres's memory. Transaction pooling: the stages hold no session state (no
# advisory locks, LISTEN, temporary tables or SET; a role's `SET role` default applies when its server connection
# logs in, and PgBouncer keeps a server connection to one role). pgjdbc's prepared statements need PgBouncer 1.21
# or later with max_prepared_statements; extra_float_digits is a startup parameter pgjdbc sends.
#
# A pool per role, 40 each and 10 more when they wait: a transform pod's commit turn holds a connection while it
# waits for the table's lock (QueuedCommits), two a pod at the most, so 18 pods' turns fit with room for their
# claims. max_db_connections keeps the whole under max_connections, with room for psql and poc.sh.
# The users and their passwords (userlist.txt) are in the secret pgbouncer-users, which poc.sh makes from its
# state directory (setup_database).
apiVersion: v1
kind: ConfigMap
metadata: { name: pgbouncer, namespace: sdh-infra }
data:
  pgbouncer.ini: |
    [databases]
    sdh = host=postgres.sdh-infra.svc port=5432 dbname=sdh

    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 5432
    unix_socket_dir =
    auth_type = scram-sha-256
    auth_file = /etc/pgbouncer/users/userlist.txt
    pool_mode = transaction
    max_client_conn = 2000
    default_pool_size = 40
    reserve_pool_size = 10
    reserve_pool_timeout = 2
    max_db_connections = 220
    max_prepared_statements = 200
    ignore_startup_parameters = extra_float_digits
    server_idle_timeout = 120
    query_wait_timeout = 120
    log_connections = 0
    log_disconnections = 0
---
apiVersion: v1
kind: Service
metadata: { name: pgbouncer, namespace: sdh-infra }
spec:
  selector: { app: pgbouncer }
  ports: [{ port: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: pgbouncer, namespace: sdh-infra }
spec:
  replicas: 1
  selector: { matchLabels: { app: pgbouncer } }
  # A new pod ready before the old one goes, so a change to the settings or the users drops no client for long.
  strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } }
  template:
    metadata: { labels: { app: pgbouncer } }
    spec:
      # Beside Postgres: one hop less, and nothing to lose that Postgres's node doesn't also take.
      nodeSelector: { "sdh-poc/pool": base, topology.kubernetes.io/zone: "${STATE_ZONE}" }
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70                     # the image's postgres user
        runAsGroup: 70
        fsGroup: 70                       # so it can read the users' secret (0440)
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:v1.26.1-p0
          # PgBouncer itself, not the image's entrypoint, which writes the settings from its environment.
          command: [/usr/bin/pgbouncer, /etc/pgbouncer/config/pgbouncer.ini]
          ports: [{ containerPort: 5432 }]
          readinessProbe: { tcpSocket: { port: 5432 }, periodSeconds: 5 }
          livenessProbe: { tcpSocket: { port: 5432 }, periodSeconds: 20, failureThreshold: 3 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/pgbouncer/config, readOnly: true }
            - { name: users, mountPath: /etc/pgbouncer/users, readOnly: true }
      volumes:
        - { name: config, configMap: { name: pgbouncer } }
        - { name: users, secret: { secretName: pgbouncer-users, defaultMode: 0440 } }
---
# One Kafka node in KRaft mode, a broker and a controller (docs/AWS-POC.md §3: one broker accepted for the PoC,
# so replication factor 1). Otherwise as in the sandbox (deploy/sandbox/infra/kafka.yaml). Topics are made by
# poc.sh; brokers don't create them.
apiVersion: v1
kind: Service
metadata: { name: kafka, namespace: sdh-infra }
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: { app: kafka }
  ports:
    - { name: broker, port: 9092 }
    - { name: controller, port: 9093 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: kafka, namespace: sdh-infra }
spec:
  serviceName: kafka
  replicas: 1
  selector: { matchLabels: { app: kafka } }
  template:
    metadata: { labels: { app: kafka } }
    spec:
      nodeSelector: { "sdh-poc/pool": base, topology.kubernetes.io/zone: "${STATE_ZONE}" }
      terminationGracePeriodSeconds: 60   # a controlled shutdown, so the logs needn't be recovered on start
      enableServiceLinks: false           # the image turns every KAFKA_* variable into configuration
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: kafka
          image: apache/kafka:4.2.2
          env:
            - { name: CLUSTER_ID, value: c2RoLXBvYy1rYWZrYS0wMQ }
            - { name: KAFKA_NODE_ID, value: "0" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka-0.kafka.sdh-infra.svc:9092" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "0@kafka-0.kafka.sdh-infra.svc:9093" }
            - { name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data/logs }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false" }
            # 30 days on every topic, as decided (docs/PERFORMANCE.md §12, point 6): longer than an outage lasts, so a
            # backlog isn't deleted before it is read. Kafka's own default is 7 days. Set for the broker, so it holds
            # for the topics made before it too, with no tool run in this pod. Size the volume for it: run 53 wrote
            # about 21 KB of messages a document (§11.1).
            - { name: KAFKA_LOG_RETENTION_HOURS, value: "720" }
            - { name: KAFKA_DEFAULT_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_MIN_INSYNC_REPLICAS, value: "1" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_HEAP_OPTS, value: "-Xms384m -Xmx384m" }
          ports:
            - { name: broker, containerPort: 9092 }
            - { name: controller, containerPort: 9093 }
          readinessProbe: { tcpSocket: { port: 9092 }, periodSeconds: 5 }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 200m, memory: 768Mi }
            limits: { memory: 768Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/kafka/data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: ""
        resources: { requests: { storage: 10Gi } }
