# Cluster Autoscaler for the Spot burst node group: adds a node when pods can't be placed, and removes it 10
# minutes after it empties. It finds node groups by the tags EKS puts on their Auto Scaling groups. The base
# groups are fixed at one node each, so it leaves them alone. AWS credentials come from Pod Identity (the
# compute layer's association for kube-system/cluster-autoscaler).
#
# The RBAC follows the upstream AWS example (kubernetes/autoscaler, cluster-autoscaler-autodiscover.yaml). The
# image minor version matches the cluster's (1.37) and is pinned by digest.
apiVersion: v1
kind: ServiceAccount
metadata: { name: cluster-autoscaler, namespace: kube-system, labels: { app: cluster-autoscaler } }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: cluster-autoscaler, labels: { app: cluster-autoscaler } }
rules:
  - { apiGroups: [""], resources: [events, endpoints], verbs: [create, patch] }
  - { apiGroups: [""], resources: [pods/eviction], verbs: [create] }
  - { apiGroups: [""], resources: [pods/status], verbs: [update] }
  - { apiGroups: [""], resources: [endpoints], resourceNames: [cluster-autoscaler], verbs: [get, update] }
  - { apiGroups: [""], resources: [nodes], verbs: [watch, list, get, update] }
  - apiGroups: [""]
    resources: [namespaces, pods, services, replicationcontrollers, persistentvolumeclaims, persistentvolumes]
    verbs: [watch, list, get]
  - { apiGroups: [extensions], resources: [replicasets, daemonsets], verbs: [watch, list, get] }
  - { apiGroups: [policy], resources: [poddisruptionbudgets], verbs: [watch, list] }
  - { apiGroups: [apps], resources: [statefulsets, replicasets, daemonsets], verbs: [watch, list, get] }
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses, csinodes, csidrivers, csistoragecapacities, volumeattachments]
    verbs: [watch, list, get]
  - { apiGroups: [batch], resources: [jobs, cronjobs], verbs: [watch, list, get, patch] }
  - { apiGroups: [coordination.k8s.io], resources: [leases], verbs: [create] }
  - { apiGroups: [coordination.k8s.io], resources: [leases], resourceNames: [cluster-autoscaler], verbs: [get, update] }
  - apiGroups: [resource.k8s.io]
    resources: [resourceclaims, resourceslices, deviceclasses]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: cluster-autoscaler, namespace: kube-system, labels: { app: cluster-autoscaler } }
rules:
  - { apiGroups: [""], resources: [configmaps], verbs: [create, list, watch] }
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [cluster-autoscaler-status, cluster-autoscaler-priority-expander]
    verbs: [delete, get, update, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: cluster-autoscaler, labels: { app: cluster-autoscaler } }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cluster-autoscaler }
subjects: [{ kind: ServiceAccount, name: cluster-autoscaler, namespace: kube-system }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: cluster-autoscaler, namespace: kube-system, labels: { app: cluster-autoscaler } }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: cluster-autoscaler }
subjects: [{ kind: ServiceAccount, name: cluster-autoscaler, namespace: kube-system }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: cluster-autoscaler, namespace: kube-system, labels: { app: cluster-autoscaler } }
spec:
  replicas: 1
  selector: { matchLabels: { app: cluster-autoscaler } }
  template:
    metadata: { labels: { app: cluster-autoscaler } }
    spec:
      serviceAccountName: cluster-autoscaler
      priorityClassName: system-cluster-critical
      nodeSelector: { "sdh-poc/pool": base }
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: cluster-autoscaler
          image: registry.k8s.io/autoscaling/cluster-autoscaler:v1.37.0@sha256:bad6629616b9544dc5e358ee030f6d1d4047192e484d2e15bffb0c9fcd90b949
          command:
            - ./cluster-autoscaler
            - --v=2
            - --cloud-provider=aws
            - --namespace=kube-system
            - --node-group-auto-discovery=asg:tag=k8s.io/cluster-autoscaler/enabled,k8s.io/cluster-autoscaler/sdh-poc
            - --balance-similar-node-groups
            - --expander=least-waste
            - --skip-nodes-with-system-pods=false
            - --skip-nodes-with-local-storage=false
            - --scale-down-unneeded-time=10m
            - --scale-down-delay-after-add=5m
          env:
            - { name: AWS_REGION, value: us-east-2 }
          resources:
            requests: { cpu: 50m, memory: 300Mi }
            limits: { memory: 300Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
