# The shared services in the AWS PoC: Postgres (catalog, leases, registries) and Kafka. S3 and KMS are AWS's
# services, so the sandbox's SeaweedFS and Vault have no counterpart here. As in the sandbox
# (deploy/sandbox/infra/namespace.yaml), only namespaces labelled sdh.smiledigitalhealth.com/infra-client reach them.
apiVersion: v1
kind: Namespace
metadata:
  name: sdh-infra
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: each-other-only, namespace: sdh-infra }
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: {} }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: clients-to-postgres, namespace: sdh-infra }
spec:
  podSelector: { matchLabels: { app: postgres } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ namespaceSelector: { matchLabels: { sdh.smiledigitalhealth.com/infra-client: "true" } } }]
      ports: [{ port: 5432 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: clients-to-kafka, namespace: sdh-infra }
spec:
  podSelector: { matchLabels: { app: kafka } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ namespaceSelector: { matchLabels: { sdh.smiledigitalhealth.com/infra-client: "true" } } }]
      ports: [{ port: 9092 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: keda-to-kafka, namespace: sdh-infra }
spec:
  podSelector: { matchLabels: { app: kafka } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: keda } },
               podSelector: { matchLabels: { app: keda-operator } } }]
      ports: [{ port: 9092 }]
