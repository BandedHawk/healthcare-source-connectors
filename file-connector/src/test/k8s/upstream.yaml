# The stages' namespace, besides the landing node and the splitter (deployed from their READMEs): the intake volume,
# and a pod that delivers files into it. For scripts/k8s-minikube.sh (design §15.2).
# The intake volume the landing README's Deployment mounts. Both landing replicas and the upstream pod run on the
# one node, so ReadWriteOnce is enough here; a multi-node cluster needs ReadWriteMany.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: landing-claims-intake }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
# Stands in for whatever delivers files (an SFTP server, a sync job): shares the intake volume with landing.
# Restricted, like the stages.
apiVersion: v1
kind: Pod
metadata: { name: upstream }
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile: { type: RuntimeDefault }
  containers:
    - name: upstream
      image: busybox:1.37.0
      command: [sleep, "86400"]
      securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
      volumeMounts: [{ name: intake, mountPath: /data/intake }]
  volumes:
    - { name: intake, persistentVolumeClaim: { claimName: landing-claims-intake } }
