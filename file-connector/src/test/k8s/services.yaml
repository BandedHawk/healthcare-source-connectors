# What the connector needs around it, for scripts/k8s-minikube.sh (design §15.2), in a namespace of their own:
# these images don't meet the restricted Pod Security Standard that the connector's namespace enforces.
# Test-only: no persistence, no TLS, fixed credentials.
apiVersion: v1
kind: Secret
metadata: { name: services }
stringData:
  postgres-password: sdh-k8s-postgres
  s3-secret-key: sdh-k8s-secret-key-0123456789
  s3.json: |
    {"identities":[{"name":"sdh","credentials":[{"accessKey":"sdh-k8s-access","secretKey":"sdh-k8s-secret-key-0123456789"}],
      "actions":["Admin","Read","Write","List","Tagging"]}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres }
spec:
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:18.4
          env:
            - { name: POSTGRES_DB, value: sdh }
            - { name: POSTGRES_USER, value: sdh }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: services, key: postgres-password } }
          ports: [{ containerPort: 5432 }]
          readinessProbe: { exec: { command: [pg_isready, -U, sdh, -d, sdh] }, periodSeconds: 2 }
---
apiVersion: v1
kind: Service
metadata: { name: postgres }
spec: { selector: { app: postgres }, ports: [{ port: 5432 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: seaweedfs }
spec:
  selector: { matchLabels: { app: seaweedfs } }
  template:
    metadata: { labels: { app: seaweedfs } }
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.48
          args: [server, -s3, -s3.config=/etc/seaweedfs/s3.json, -dir=/data, -ip.bind=0.0.0.0, -volume.max=10]
          ports: [{ containerPort: 8333 }]
          readinessProbe: { tcpSocket: { port: 8333 }, periodSeconds: 2 }
          volumeMounts:
            - { name: config, mountPath: /etc/seaweedfs, readOnly: true }
            - { name: data, mountPath: /data }
      volumes:
        - { name: config, secret: { secretName: services, items: [{ key: s3.json, path: s3.json }] } }
        - { name: data, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata: { name: seaweedfs }
spec: { selector: { app: seaweedfs }, ports: [{ port: 8333 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: kafka }
spec:
  selector: { matchLabels: { app: kafka } }
  template:
    metadata: { labels: { app: kafka } }
    spec:
      # The image turns every KAFKA_* variable into broker configuration, including the KAFKA_PORT and similar
      # variables Kubernetes would add for the service named kafka.
      enableServiceLinks: false
      containers:
        - name: kafka
          image: apache/kafka:4.2.2
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            # Advertised by full name: the connector runs in another namespace.
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka.$(POD_NAMESPACE).svc:9092" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
          ports: [{ containerPort: 9092 }]
          readinessProbe: { tcpSocket: { port: 9092 }, periodSeconds: 2 }
---
apiVersion: v1
kind: Service
metadata: { name: kafka }
spec: { selector: { app: kafka }, ports: [{ port: 9092 }] }
