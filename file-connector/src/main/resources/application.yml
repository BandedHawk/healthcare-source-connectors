spring:
  application:
    name: file-connector
  main:
    banner-mode: off

camel:
  main:
    name: file-connector
    # PHI hygiene (design §7.5): no body logging, tracing or message history.
    tracing: false
    backlog-tracing: false
    message-history: false
    log-mask: true
    log-exhausted-message-body: false
  springboot:
    main-run-controller: true

# Telemetry (design §12): spans are exported through sdh.telemetry.otlp (with the PHI allow-list filter), so Boot's
# own OTLP exporters and the Micrometer OTLP metrics registry are off. Sample every trace: one per file is cheap.
management:
  tracing:
    sampling:
      probability: 1.0
    export:
      otlp:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false
  otlp:
    metrics:
      export:
        enabled: false

sdh:
  file:
    inbound-dir: /data/inbound
    min-age: 30s
