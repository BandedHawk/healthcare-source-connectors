spring:
  application:
    name: file-connector
  main:
    banner-mode: off

camel:
  main:
    name: file-connector
    # PHI hygiene (design §7.5): no body logging, tracing or message history.
    tracing: false
    backlog-tracing: false
    message-history: false
    log-mask: true
    log-exhausted-message-body: false
    # Keeps the JVM alive: the app has no web server or other non-daemon thread. (Camel 4 reads this here; the old
    # camel.springboot.main-run-controller is ignored, and the packaged app exited right after starting.)
    run-controller: true

# Telemetry (design §12): spans are exported through sdh.telemetry.otlp (with the PHI allow-list filter), so Boot's
# own OTLP trace and log exporters are off. Sample every trace: one per file is cheap.
management:
  tracing:
    sampling:
      probability: 1.0
    export:
      otlp:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false
  # The JVM's metrics only, with only the JVM's tags (design §12.2): the collector, headers and interval are
  # sdh.telemetry's, and sdh.telemetry.jvm-metrics: false turns them off.
  otlp:
    metrics:
      export:
        enabled: true

# Azure uses the JDK HTTP client (design §8.1). It warns on every storage request that it ignores the SDK's
# Content-Length header; the JDK sets that header itself from the request body, so the warning is noise (about one
# line per request). Errors from it are still logged.
logging:
  level:
    com.azure.core.http.jdk.httpclient.JdkHttpClient: error

sdh:
  stage:
    input:
      # As many item.landed messages per batch as the pod splits at once (sdh.split.concurrency): a batch is held
      # until each of its items is split (STAGES.md §8), so a larger one would hold finished items' messages behind
      # a slow one.
      batch:
        max-messages: ${sdh.split.concurrency:4}
  landing:
    # Landed items whose item.landed message was lost (docs/DEPLOYMENT.md).
    reconcile:
      enabled: true
      grace: 10m
      interval: 15m
